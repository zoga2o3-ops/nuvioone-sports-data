name: Update sports data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_wrestling:
        description: "Rebuild wrestling/boxing even if the file is fresh"
        type: boolean
        default: false
      force_leagues:
        description: "Rebuild extra football leagues even if the index is fresh"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: espn-cache
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Prepare the data worktree
        run: |
          set -e
          git config --global user.name "nuvio-sports-data"
          git config --global user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git worktree add ../data FETCH_HEAD
          else
            git worktree add --detach ../data
            cd ../data
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Fetch ESPN scoreboards
        run: python3 scripts/espn_cache.py --output ../data/espn --budget 270

      - name: Fetch wrestling schedule
        continue-on-error: true
        env:
          FORCE_WRESTLING: ${{ inputs.force_wrestling }}
        run: |
          EXTRA=""
          if [ "$FORCE_WRESTLING" = "true" ]; then EXTRA="--force"; fi
          python3 scripts/wrestling_cache.py --output ../data/wrestling.json --max-age 18000 $EXTRA

      - name: Fetch extra football leagues
        continue-on-error: true
        env:
          FORCE_LEAGUES: ${{ inputs.force_leagues }}
        run: |
          EXTRA=""
          if [ "$FORCE_LEAGUES" = "true" ]; then EXTRA="--force"; fi
          python3 scripts/fotmob_cache.py --output ../data/sportsdb --games-output ../data/sportsdb/games --max-age 21600 --details-days 7 $EXTRA

      - name: Commit and push
        working-directory: ../data
        run: |
          set -e
          git add espn
          if [ -d sportsdb ]; then git add sportsdb; fi
          if [ -f wrestling.json ]; then git add wrestling.json; fi
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update sports data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:data
